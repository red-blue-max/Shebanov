# Автодеплой на Timeweb: при каждом push в main сайт собирается и выгружается по FTP
# в папку сайта на хостинге. Выгружаются только изменившиеся файлы.
#
# Нужны секреты репозитория (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER     — адрес FTP-сервера из панели Timeweb (например, vh123.timeweb.ru)
#   FTP_USERNAME   — логин FTP
#   FTP_PASSWORD   — пароль FTP
#   FTP_SERVER_DIR — папка сайта на сервере, с / на конце (например, shebanov-swim.ru/public_html/)
# Необязательно:
#   FTP_PROTOCOL   — ftps (по умолчанию) или ftp, если сервер не поддерживает шифрование
# Пока секретов нет, шаг выгрузки пропускается, а сборка всё равно проверяется.

name: Деплой на Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-timeweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_DIR: ${{ github.workspace }}/_deploy
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Сборка и упаковка сайта
        run: python tools/package.py

      - name: Папка на сервере (косая черта в конце обязательна)
        if: env.FTP_SERVER != ''
        id: dir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          d="$(echo "$RAW_DIR" | xargs)"   # убрать пробелы по краям
          d="${d#/}"; d="${d%/}/"            # без / в начале, с / в конце
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"
          echo "Выгрузка в папку: $d"

      - name: Выгрузка на Timeweb по FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ${{ github.workspace }}/_deploy/shebanov-swim.ru/
          server-dir: ${{ steps.dir.outputs.server_dir }}
          log-level: verbose

      - name: Секреты FTP не заданы
        if: env.FTP_SERVER == ''
        run: echo "::notice::Сборка прошла, но выгрузка пропущена — добавьте секреты FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR."
